<!DOCTYPE html>
<html lang="en" class="h-full bg-zinc-950 text-zinc-100">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>CloudShell Terminal</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- xterm.js & Addons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.css" />
  <script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit@0.8.0/lib/xterm-addon-fit.js"></script>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'JetBrains Mono', monospace;
      touch-action: manipulation;
    }
    /* Custom scrollbar for xterm */
    .xterm-viewport::-webkit-scrollbar {
      width: 6px;
    }
    .xterm-viewport::-webkit-scrollbar-track {
      background: #09090b;
    }
    .xterm-viewport::-webkit-scrollbar-thumb {
      background: #27272a;
      border-radius: 3px;
    }
    .xterm-viewport::-webkit-scrollbar-thumb:hover {
      background: #3f3f46;
    }
  </style>
</head>
<body class="h-[100dvh] w-full flex flex-col overflow-hidden bg-zinc-950 select-none">

  <!-- ================= TOP HEADER & TABS BAR ================= -->
  <header class="flex-none bg-zinc-900 border-b border-zinc-800/80 px-2 sm:px-3 pt-2 flex flex-col gap-1">
    
    <!-- Top Meta Row -->
    <div class="flex items-center justify-between pb-1 text-xs">
      <div class="flex items-center gap-2">
        <div class="flex items-center gap-1.5 px-2 py-0.5 rounded bg-emerald-950/60 border border-emerald-500/30 text-emerald-400">
          <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
          <span class="font-semibold tracking-wider text-[10px]">CONNECTED</span>
        </div>
        <span class="text-zinc-400 hidden sm:inline">prod-srv-fra-01</span>
        <span class="text-zinc-600 hidden sm:inline">•</span>
        <span class="text-zinc-500 text-[11px] hidden md:inline">10.0.4.128 (TLS 1.3 / 14ms)</span>
      </div>

      <!-- Controls -->
      <div class="flex items-center gap-2">
        <button id="clear-btn" class="px-2 py-1 bg-zinc-800/60 hover:bg-zinc-700 rounded text-zinc-300 transition text-[11px]">
          Clear
        </button>
        <button id="reconnect-btn" class="px-2 py-1 bg-zinc-800/60 hover:bg-zinc-700 rounded text-zinc-300 transition text-[11px]">
          ⚡ Restart
        </button>
      </div>
    </div>

    <!-- Tabs Row -->
    <div class="flex items-center gap-1 overflow-x-auto no-scrollbar pt-1">
      <!-- Active Tab -->
      <div class="tab-item active group flex items-center gap-2 px-3 py-1.5 bg-zinc-950 border-t border-x border-zinc-700/80 rounded-t text-xs text-zinc-100 cursor-pointer transition">
        <span class="text-emerald-400"></span>
        <span class="font-medium">1: zsh (main)</span>
        <span class="text-zinc-500 hover:text-zinc-300 ml-1 text-xs">×</span>
      </div>

      <!-- Inactive Tab 1 -->
      <div class="tab-item group flex items-center gap-2 px-3 py-1.5 bg-zinc-900 hover:bg-zinc-800/50 border-t border-x border-transparent rounded-t text-xs text-zinc-400 hover:text-zinc-200 cursor-pointer transition">
        <span class="text-amber-400"></span>
        <span class="font-medium">2: htop</span>
        <span class="text-zinc-600 group-hover:text-zinc-400 ml-1 text-xs">×</span>
      </div>

      <!-- Inactive Tab 2 -->
      <div class="tab-item group flex items-center gap-2 px-3 py-1.5 bg-zinc-900 hover:bg-zinc-800/50 border-t border-x border-transparent rounded-t text-xs text-zinc-400 hover:text-zinc-200 cursor-pointer transition hidden sm:flex">
        <span class="text-cyan-400"></span>
        <span class="font-medium">3: vim config.yml</span>
        <span class="text-zinc-600 group-hover:text-zinc-400 ml-1 text-xs">×</span>
      </div>

      <!-- New Tab Button -->
      <button class="px-2.5 py-1 text-zinc-400 hover:text-zinc-100 hover:bg-zinc-800/60 rounded text-sm transition">
        +
      </button>
    </div>
  </header>

  <!-- ================= MAIN TERMINAL AREA ================= -->
  <main class="flex-1 w-full bg-zinc-950 p-2 sm:p-3 overflow-hidden relative">
    <div id="terminal-container" class="w-full h-full"></div>
  </main>

  <!-- ================= MOBILE / QUICK KEYS TOOLBAR ================= -->
  <!-- Essential for touchscreens where physical Ctrl/Tab/Esc don't exist -->
  <div class="flex-none bg-zinc-900 border-t border-zinc-800/80 px-2 py-1.5 flex items-center justify-between gap-1 overflow-x-auto text-xs select-none">
    <div class="flex items-center gap-1.5">
      <button onclick="sendKey('\x1b')" class="key-btn px-2.5 py-1 bg-zinc-800 hover:bg-zinc-700 active:bg-zinc-600 rounded text-zinc-300 font-bold">ESC</button>
      <button onclick="sendKey('\t')" class="key-btn px-2.5 py-1 bg-zinc-800 hover:bg-zinc-700 active:bg-zinc-600 rounded text-zinc-300 font-bold">TAB</button>
      <button onclick="sendCtrlC()" class="key-btn px-2.5 py-1 bg-zinc-800 hover:bg-zinc-700 active:bg-zinc-600 rounded text-amber-400 font-bold">CTRL+C</button>
      <button onclick="sendKey('|')" class="key-btn px-2.5 py-1 bg-zinc-800/60 hover:bg-zinc-700 rounded text-zinc-400">|</button>
      <button onclick="sendKey('~')" class="key-btn px-2.5 py-1 bg-zinc-800/60 hover:bg-zinc-700 rounded text-zinc-400">~</button>
      <button onclick="sendKey('/')" class="key-btn px-2.5 py-1 bg-zinc-800/60 hover:bg-zinc-700 rounded text-zinc-400">/</button>
      <button onclick="sendKey('-')" class="key-btn px-2.5 py-1 bg-zinc-800/60 hover:bg-zinc-700 rounded text-zinc-400">-</button>
    </div>

    <!-- Arrow Navigation -->
    <div class="flex items-center gap-1">
      <button onclick="sendKey('\x1b[A')" class="key-btn px-2.5 py-1 bg-zinc-800 hover:bg-zinc-700 rounded text-zinc-300">↑</button>
      <button onclick="sendKey('\x1b[B')" class="key-btn px-2.5 py-1 bg-zinc-800 hover:bg-zinc-700 rounded text-zinc-300">↓</button>
      <button onclick="sendKey('\x1b[D')" class="key-btn px-2.5 py-1 bg-zinc-800 hover:bg-zinc-700 rounded text-zinc-300">←</button>
      <button onclick="sendKey('\x1b[C')" class="key-btn px-2.5 py-1 bg-zinc-800 hover:bg-zinc-700 rounded text-zinc-300">→</button>
    </div>
  </div>

  <!-- ================= JAVASCRIPT / MOCK ENGINE ================= -->
  <script>
    // 1. Initialize xterm.js with Tokyo Night theme
    const term = new Terminal({
      theme: {
        background: '#09090b', // zinc-950
        foreground: '#f4f4f5', // zinc-100
        cursor: '#10b981',     // emerald-500
        cursorAccent: '#09090b',
        selectionBackground: '#3f3f46',
        black: '#18181b',
        red: '#ef4444',
        green: '#10b981',
        yellow: '#f59e0b',
        blue: '#3b82f6',
        magenta: '#d946ef',
        cyan: '#06b6d4',
        white: '#f4f4f5',
        brightBlack: '#71717a',
        brightRed: '#f87171',
        brightGreen: '#34d399',
        brightYellow: '#fbbf24',
        brightBlue: '#60a5fa',
        brightMagenta: '#e879f9',
        brightCyan: '#22d3ee',
        brightWhite: '#ffffff'
      },
      fontFamily: "'JetBrains Mono', monospace",
      fontSize: 14,
      lineHeight: 1.25,
      cursorBlink: true,
      cursorStyle: 'block',
      allowProposedApi: true
    });

    // 2. Setup Fit Addon
    const fitAddon = new FitAddon.FitAddon();
    term.loadAddon(fitAddon);
    const container = document.getElementById('terminal-container');
    term.open(container);
    fitAddon.fit();

    window.addEventListener('resize', () => {
      fitAddon.fit();
    });

    // 3. Prompt string with special symbols (Powerline-style prompt)
    const prompt = () => {
      term.write('\r\n\x1b[38;2;16;185;129m➜ \x1b[38;2;59;130;246madmin@cloud-01 \x1b[38;2;161;161;170min \x1b[38;2;245;158;11m~/projects/web-term \x1b[38;2;217;70;239mon  main \x1b[0m\r\n\x1b[38;2;16;185;129mλ \x1b[0m');
    };

    // 4. Initial Welcome Banner
    function showWelcome() {
      term.reset();
      term.writeln('\x1b[38;2;16;185;129m┌─────────────────────────────────────────────────────────────┐\x1b[0m');
      term.writeln('\x1b[38;2;16;185;129m│\x1b[0m  \x1b[1;37mCloudShell v2.4 (x86_64-pc-linux-gnu)\x1b[0m                      \x1b[38;2;16;185;129m│\x1b[0m');
      term.writeln('\x1b[38;2;16;185;129m│\x1b[0m  Type \x1b[1;33mhelp\x1b[0m, \x1b[1;33mneofetch\x1b[0m, \x1b[1;33mls\x1b[0m, \x1b[1;33mhtop\x1b[0m, or \x1b[1;33mclear\x1b[0m to test the mock shell.  \x1b[38;2;16;185;129m│\x1b[0m');
      term.writeln('\x1b[38;2;16;185;129m└─────────────────────────────────────────────────────────────┘\x1b[0m');
      prompt();
    }

    showWelcome();

    // 5. Mock Shell Input State Machine
    let currentLine = '';
    let history = [];
    let historyIndex = -1;

    term.onData(e => {
      switch (e) {
        case '\r': // Enter
          handleCommand(currentLine.trim());
          if (currentLine.trim().length > 0) {
            history.push(currentLine.trim());
            historyIndex = history.length;
          }
          currentLine = '';
          break;

        case '\u007F': // Backspace
          if (currentLine.length > 0) {
            currentLine = currentLine.slice(0, -1);
            term.write('\b \b');
          }
          break;

        case '\x03': // Ctrl+C
          term.write('^C');
          currentLine = '';
          prompt();
          break;

        case '\x1b[A': // Up Arrow (History)
          if (history.length > 0 && historyIndex > 0) {
            historyIndex--;
            clearInputLine();
            currentLine = history[historyIndex];
            term.write(currentLine);
          }
          break;

        case '\x1b[B': // Down Arrow (History)
          if (historyIndex < history.length - 1) {
            historyIndex++;
            clearInputLine();
            currentLine = history[historyIndex];
            term.write(currentLine);
          } else {
            historyIndex = history.length;
            clearInputLine();
            currentLine = '';
          }
          break;

        default: // Normal typed characters
          if (e >= String.fromCharCode(0x20) && e <= String.fromCharCode(0x7e) || e >= '\u00a0') {
            currentLine += e;
            term.write(e);
          }
      }
    });

    function clearInputLine() {
      while (currentLine.length > 0) {
        term.write('\b \b');
        currentLine = currentLine.slice(0, -1);
      }
    }

    // 6. Mock Command Execution
    function handleCommand(cmd) {
      const args = cmd.split(' ');
      const mainCmd = args[0].toLowerCase();

      switch (mainCmd) {
        case '':
          prompt();
          break;

        case 'clear':
          term.reset();
          prompt();
          break;

        case 'help':
          term.writeln('\r\n\x1b[1;36mAvailable mock commands:\x1b[0m');
          term.writeln('  \x1b[33mneofetch\x1b[0m   - Display system specs & ASCII logo');
          term.writeln('  \x1b[33mls\x1b[0m         - List directory files with colors & permissions');
          term.writeln('  \x1b[33mcat [file]\x1b[0m - Print file contents (e.g. `cat main.go`)');
          term.writeln('  \x1b[33mhtop\x1b[0m       - Show interactive-like task manager');
          term.writeln('  \x1b[33mclear\x1b[0m      - Clear screen buffer');
          term.writeln('  \x1b[33mwhoami\x1b[0m     - Print active user');
          prompt();
          break;

        case 'whoami':
          term.writeln('\r\nadmin (uid=1000, gid=1000, groups=sudo,docker)');
          prompt();
          break;

        case 'ls':
          term.writeln('\r\n\x1b[1;34mdrwxr-xr-x\x1b[0m  4 admin  staff   128B Aug 16 10:22 \x1b[1;34m.git\x1b[0m');
          term.writeln('\x1b[1;34mdrwxr-xr-x\x1b[0m  2 admin  staff    64B Aug 16 10:24 \x1b[1;34mbin\x1b[0m');
          term.writeln('-rw-r--r--  1 admin  staff   1.2K Aug 16 11:05 \x1b[32mmain.go\x1b[0m');
          term.writeln('-rw-r--r--  1 admin  staff    450B Aug 16 09:12 config.yaml');
          term.writeln('-rw-r--r--  1 admin  staff   3.4K Aug 16 10:15 README.md');
          prompt();
          break;

        case 'cat':
          if (args[1] === 'config.yaml') {
            term.writeln('\r\n\x1b[38;2;161;161;170m# Server Configuration');
            term.writeln('port: 8080');
            term.writeln('tls: true');
            term.writeln('pty: /bin/zsh');
            term.writeln('max_clients: 5\x1b[0m');
          } else {
            term.writeln('\r\n\x1b[32mpackage main\x1b[0m');
            term.writeln('\x1b[34mimport\x1b[0m "fmt"');
            term.writeln('\x1b[35mfunc\x1b[0m main() {');
            term.writeln('    fmt.Println("🚀 CloudShell is ultra fast!")');
            term.writeln('}');
          }
          prompt();
          break;

        case 'neofetch':
          term.writeln('');
          term.writeln('  \x1b[38;2;16;185;129m  ___ _                 _ ____  _          _ _ \x1b[0m   \x1b[1;37madmin\x1b[0m@\x1b[1;32mprod-srv-01\x1b[0m');
          term.writeln('  \x1b[38;2;16;185;129m / __| |___ _  _ __| / ___|| |_  ___| | |\x1b[0m   ----------------');
          term.writeln('  \x1b[38;2;16;185;129m| (__| / _ \\ || / _` \\___ \\| \' \\/ -_) | |\x1b[0m   \x1b[1;34mOS:\x1b[0m Alpine Linux 3.20 (x86_64)');
          term.writeln('  \x1b[38;2;16;185;129m \\___|_\\___/\\_,_\\__,_|____/|_||_\\___|_|_|\x1b[0m   \x1b[1;34mKernel:\x1b[0m 6.6.32-linux');
          term.writeln('                                                \x1b[1;34mUptime:\x1b[0m 42 days, 3 hours');
          term.writeln('  \x1b[31m● \x1b[32m● \x1b[33m● \x1b[34m● \x1b[35m● \x1b[36m● \x1b[37m● \x1b[0m                             \x1b[1;34mMemory:\x1b[0m 284MiB / 2048MiB (13%)');
          term.writeln('                                                \x1b[1;34mShell:\x1b[0m zsh 5.9 + Starship');
          prompt();
          break;

        case 'htop':
          term.writeln('\r\n\x1b[7m  PID USER      PRI  NI  VIRT   RES   SHR S CPU% MEM%   TIME+  Command               \x1b[0m');
          term.writeln('    1 root       20   0 16.8M  8.2M  5.1M S  0.0  0.4  0:02.14 /sbin/init');
          term.writeln('  412 admin      20   0 48.2M 14.5M 10.2M S  1.2  0.7  1:42.08 ./ttyd-server -p 8080');
          term.writeln('  415 admin      20   0 12.1M  6.8M  4.2M S  0.0  0.3  0:00.32 /bin/zsh');
          term.writeln('  520 admin      20   0 18.4M  4.2M  3.1M R  2.5  0.2  0:00.04 htop');
          prompt();
          break;

        default:
          term.writeln(`\r\nzsh: command not found: ${cmd}`);
          prompt();
          break;
      }
    }

    // Helper functions for virtual toolbar buttons
    function sendKey(character) {
      term.input(character);
      term.focus();
    }

    function sendCtrlC() {
      term.input('\x03');
      term.focus();
    }

    document.getElementById('clear-btn').addEventListener('click', () => {
      term.reset();
      prompt();
    });

    document.getElementById('reconnect-btn').addEventListener('click', () => {
      showWelcome();
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-50 text-slate-900">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Tree Maker — Mobile Hierarchical Notes</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: { 50: '#eef2ff', 100: '#e0e7ff', 500: '#6366f1', 600: '#4f46e5', 700: '#4338ca' }
          }
        }
      }
    }
  </script>
  <style>
    /* Clean horizontal scrollbar for long breadcrumbs */
    .scrollbar-none::-webkit-scrollbar { display: none; }
    .scrollbar-none { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="h-full flex flex-col font-sans antialiased select-none">

  <!-- ================= TOP HEADER ================= -->
  <header class="bg-white border-b border-slate-200 shrink-0 sticky top-0 z-30 shadow-xs">
    <div class="max-w-4xl mx-auto px-4 h-14 flex items-center justify-between gap-3">
      <div class="flex items-center gap-2">
        <div class="w-8 h-8 rounded-lg bg-brand-600 text-white flex items-center justify-center font-bold">
          <i data-lucide="git-fork" class="w-4 h-4 rotate-180"></i>
        </div>
        <h1 class="font-bold text-base tracking-tight">Tree Maker</h1>
      </div>

      <div class="flex items-center gap-1.5">
        <button onclick="openSearchModal()" class="p-2 text-slate-500 hover:text-slate-800 rounded-lg hover:bg-slate-100 transition">
          <i data-lucide="search" class="w-5 h-5"></i>
        </button>
        <button onclick="openCreateModal(null)" class="flex items-center gap-1 px-3 py-1.5 rounded-lg bg-brand-600 hover:bg-brand-700 text-white font-medium text-xs shadow-sm transition">
          <i data-lucide="plus" class="w-4 h-4"></i>
          <span>New Root</span>
        </button>
      </div>
    </div>

    <!-- Long-path capable Breadcrumbs bar -->
    <div class="border-t border-slate-100 bg-slate-50/80 px-4 py-2">
      <div class="max-w-4xl mx-auto flex items-center gap-1.5 text-xs text-slate-500 overflow-x-auto scrollbar-none whitespace-nowrap" id="breadcrumbsTrack">
        <!-- Rendered breadcrumb segments -->
      </div>
    </div>
  </header>

  <!-- ================= MAIN CONTENT: THE HIERARCHICAL TREE ================= -->
  <main class="flex-1 overflow-y-auto px-3 py-4 max-w-4xl mx-auto w-full pb-24" id="mainScroll">
    <div id="treeContainer" class="space-y-1">
      <div class="text-center text-xs text-slate-400 py-12">Loading notes tree...</div>
    </div>
  </main>

  <!-- ================= FLOATING CLIPBOARD BAR (CUT / COPY / PASTE) ================= -->
  <div id="clipboardBar" class="fixed bottom-4 left-4 right-4 max-w-lg mx-auto bg-slate-900 text-white rounded-2xl shadow-2xl p-3 px-4 z-40 hidden flex items-center justify-between gap-3 animate-bounce-short">
    <div class="flex items-center gap-2.5 min-w-0">
      <span id="clipboardIcon" class="w-7 h-7 rounded-lg bg-white/10 flex items-center justify-center text-brand-300 shrink-0">
        <i data-lucide="copy" class="w-4 h-4"></i>
      </span>
      <div class="truncate">
        <p id="clipboardOpText" class="text-[10px] text-slate-400 font-semibold uppercase tracking-wider">Copied</p>
        <p id="clipboardTitle" class="text-xs font-medium truncate">Note title</p>
      </div>
    </div>
    <div class="flex items-center gap-1.5 shrink-0">
      <button onclick="pasteClipboard(null)" class="px-2.5 py-1.5 rounded-lg bg-white/10 hover:bg-white/20 text-xs font-medium text-slate-200 transition">
        Paste as Root
      </button>
      <button onclick="clearClipboard()" class="p-1.5 text-slate-400 hover:text-white rounded-lg transition" title="Cancel">
        <i data-lucide="x" class="w-4 h-4"></i>
      </button>
    </div>
  </div>

  <!-- ================= BOTTOM SHEET: NODE ACTION MENU ================= -->
  <div id="actionSheet" class="fixed inset-0 bg-slate-900/50 backdrop-blur-xs z-50 hidden flex flex-col justify-end" onclick="closeModal('actionSheet')">
    <div class="bg-white rounded-t-2xl p-4 w-full max-w-md mx-auto shadow-2xl space-y-3" onclick="event.stopPropagation()">
      <div class="flex items-center justify-between pb-2 border-b border-slate-100">
        <div class="truncate pr-2">
          <span class="text-[10px] font-semibold uppercase tracking-wider text-slate-400" id="actionSheetSubtitle">Note Options</span>
          <h3 class="font-bold text-sm text-slate-900 truncate" id="actionSheetTitle">Note Title</h3>
        </div>
        <button onclick="closeModal('actionSheet')" class="p-1.5 text-slate-400 hover:text-slate-600 rounded-lg">
          <i data-lucide="x" class="w-4 h-4"></i>
        </button>
      </div>

      <div class="grid grid-cols-2 gap-2 text-xs">
        <button onclick="openEditorSheet(state.targetActionNodeId)" class="flex items-center gap-2 p-3 rounded-xl bg-slate-50 hover:bg-slate-100 font-medium text-slate-800">
          <i data-lucide="file-edit" class="w-4 h-4 text-brand-600"></i> View / Edit Note
        </button>
        <button onclick="openCreateModal(state.targetActionNodeId)" class="flex items-center gap-2 p-3 rounded-xl bg-slate-50 hover:bg-slate-100 font-medium text-slate-800">
          <i data-lucide="plus-circle" class="w-4 h-4 text-emerald-600"></i> Add Sub-note
        </button>
        <button onclick="executeCut(state.targetActionNodeId)" class="flex items-center gap-2 p-3 rounded-xl bg-slate-50 hover:bg-slate-100 font-medium text-slate-800">
          <i data-lucide="scissors" class="w-4 h-4 text-amber-600"></i> Cut (Move)
        </button>
        <button onclick="executeCopy(state.targetActionNodeId)" class="flex items-center gap-2 p-3 rounded-xl bg-slate-50 hover:bg-slate-100 font-medium text-slate-800">
          <i data-lucide="copy" class="w-4 h-4 text-indigo-600"></i> Deep Copy
        </button>
        <button id="actionSheetPasteBtn" onclick="pasteClipboard(state.targetActionNodeId)" class="col-span-2 hidden flex items-center justify-center gap-2 p-3 rounded-xl bg-brand-50 hover:bg-brand-100 text-brand-700 font-semibold">
          <i data-lucide="clipboard-paste" class="w-4 h-4"></i> Paste Inside This Note
        </button>
        <button onclick="executeDelete(state.targetActionNodeId)" class="col-span-2 flex items-center justify-center gap-2 p-2.5 rounded-xl text-rose-600 hover:bg-rose-50 font-medium transition">
          <i data-lucide="trash-2" class="w-4 h-4"></i> Cascade Delete Subtree
        </button>
      </div>
    </div>
  </div>

  <!-- ================= SLIDE-OVER / MODAL: VIEW & EDIT NOTE ================= -->
  <div id="editorSheet" class="fixed inset-0 bg-slate-900/40 backdrop-blur-xs z-50 hidden flex justify-end">
    <div class="bg-white w-full max-w-xl h-full flex flex-col shadow-2xl">
      <!-- Editor Top Bar -->
      <div class="h-14 px-4 border-b border-slate-200 flex items-center justify-between shrink-0">
        <button onclick="closeModal('editorSheet')" class="flex items-center gap-1 text-xs text-slate-500 hover:text-slate-900">
          <i data-lucide="chevron-left" class="w-4 h-4"></i> Back to Tree
        </button>
        <div class="flex items-center gap-2">
          <span id="editorSaveStatus" class="text-[11px] text-slate-400">Up to date</span>
          <button id="editorSaveBtn" onclick="saveActiveNote()" class="px-3 py-1.5 bg-brand-600 hover:bg-brand-700 text-white rounded-lg text-xs font-semibold disabled:opacity-40" disabled>
            Save
          </button>
        </div>
      </div>

      <!-- Editor Content -->
      <div class="flex-1 overflow-y-auto p-4 space-y-4">
        <div class="flex flex-wrap items-center gap-1.5 text-[11px] text-slate-500" id="editorPills"></div>

        <div>
          <label class="block text-[10px] font-bold uppercase tracking-wider text-slate-400 mb-1">Title</label>
          <input id="editTitle" oninput="markDirty()" type="text" class="w-full text-xl font-bold text-slate-900 border-b border-slate-200 pb-1 focus:border-brand-600 outline-none">
        </div>

        <div class="flex-1 flex flex-col">
          <label class="block text-[10px] font-bold uppercase tracking-wider text-slate-400 mb-1">Content</label>
          <textarea id="editContent" oninput="markDirty()" rows="10" placeholder="Type notes..." class="w-full p-3 text-sm bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:ring-1 focus:ring-brand-500 outline-none resize-y font-mono"></textarea>
        </div>
      </div>
    </div>
  </div>

  <!-- ================= MODAL: CREATE NOTE ================= -->
  <div id="createModal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-xs z-50 hidden flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl shadow-xl w-full max-w-sm p-5 space-y-4">
      <div class="flex justify-between items-center">
        <h3 class="font-bold text-sm text-slate-900" id="createModalTitle">Create Note</h3>
        <button onclick="closeModal('createModal')" class="text-slate-400 hover:text-slate-600"><i data-lucide="x" class="w-4 h-4"></i></button>
      </div>
      <div class="space-y-3">
        <div>
          <label class="block text-xs font-medium text-slate-600 mb-1">Title</label>
          <input id="newNoteTitle" type="text" class="w-full px-3 py-2 border border-slate-200 rounded-lg text-xs outline-none focus:ring-1 focus:ring-brand-500" placeholder="Title...">
        </div>
        <div>
          <label class="block text-xs font-medium text-slate-600 mb-1">Content (optional)</label>
          <textarea id="newNoteContent" rows="3" class="w-full px-3 py-2 border border-slate-200 rounded-lg text-xs outline-none focus:ring-1 focus:ring-brand-500" placeholder="Content..."></textarea>
        </div>
      </div>
      <div class="flex justify-end gap-2 pt-1">
        <button onclick="closeModal('createModal')" class="px-3 py-1.5 text-xs text-slate-600 hover:bg-slate-100 rounded-lg">Cancel</button>
        <button onclick="submitCreateNode()" class="px-3 py-1.5 text-xs bg-brand-600 text-white rounded-lg hover:bg-brand-700 font-semibold">Create Note</button>
      </div>
    </div>
  </div>

  <!-- ================= MODAL: SEARCH (read_all) ================= -->
  <div id="searchModal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-xs z-50 hidden flex items-start justify-center p-4 pt-16" onclick="closeModal('searchModal')">
    <div class="bg-white rounded-2xl shadow-2xl w-full max-w-md p-4 space-y-3" onclick="event.stopPropagation()">
      <div class="relative">
        <i data-lucide="search" class="w-4 h-4 absolute left-3 top-3 text-slate-400"></i>
        <input id="modalSearchInput" oninput="handleSearch(this.value)" type="text" placeholder="Search title or content..."
               class="w-full pl-9 pr-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs outline-none focus:ring-1 focus:ring-brand-500">
      </div>
      <div id="searchResults" class="max-h-64 overflow-y-auto space-y-1 text-xs">
        <p class="text-slate-400 text-center py-4">Type to search notes...</p>
      </div>
    </div>
  </div>

  <!-- ================= JAVASCRIPT ================= -->
  <script>
    /* -------------------------------------------------------------
       1. LOCALSTORAGE MOCK BACKEND (POST /api/tree/<action>)
    ------------------------------------------------------------- */
    const STORAGE_KEY = 'TREE_MAKER_MOBILE_DATA';

    const SEED_DATA = [
      { id: 1, parent: null, title: 'Projects & Work', content: 'Engineering and roadmap tracking.', depth: 0, child_count: 2, date_created: '2026-09-01', date_updated: '2026-09-02' },
      { id: 2, parent: 1, title: 'Mobile UI Overhaul', content: 'Improve touch navigation, breadcrumbs and separate cut/copy ops.', depth: 1, child_count: 1, date_created: '2026-09-02', date_updated: '2026-09-03' },
      { id: 3, parent: 2, title: 'Breadcrumbs Component', content: 'Support 10+ levels with responsive scroll bars.', depth: 2, child_count: 0, date_created: '2026-09-03', date_updated: '2026-09-03' },
      { id: 4, parent: 1, title: 'API Documentation', content: 'Audit Swagger and POST JSON envelopes.', depth: 1, child_count: 0, date_created: '2026-09-04', date_updated: '2026-09-04' },
      { id: 5, parent: null, title: 'Personal Vault', content: 'Reading list, finances, thoughts.', depth: 0, child_count: 1, date_created: '2026-09-05', date_updated: '2026-09-05' },
      { id: 6, parent: 5, title: 'Reading List', content: '- Designing Data-Intensive Applications\n- Crafting Interpreters', depth: 1, child_count: 0, date_created: '2026-09-06', date_updated: '2026-09-06' }
    ];

    const MockAPI = {
      getNodes() {
        const stored = localStorage.getItem(STORAGE_KEY);
        if (!stored) {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(SEED_DATA));
          return SEED_DATA;
        }
        return JSON.parse(stored);
      },

      saveNodes(nodes) {
        const getDepth = (n) => n.parent ? (getDepth(nodes.find(x => x.id === n.parent)) + 1) : 0;
        nodes.forEach(n => {
          n.depth = getDepth(n);
          n.child_count = nodes.filter(c => c.parent === n.id).length;
        });
        localStorage.setItem(STORAGE_KEY, JSON.stringify(nodes));
      },

      getDescendants(nodes, nodeId) {
        let list = [];
        const children = nodes.filter(n => n.parent === nodeId);
        for (const c of children) {
          list.push(c.id);
          list = list.concat(this.getDescendants(nodes, c.id));
        }
        return list;
      },

      getMaxDepth(nodes, nodeId) {
        const children = nodes.filter(n => n.parent === nodeId);
        if (!children.length) return 0;
        return 1 + Math.max(...children.map(c => this.getMaxDepth(nodes, c.id)));
      },

      async request(action, body = {}) {
        let nodes = this.getNodes();
        const today = new Date().toISOString().split('T')[0];

        switch (action) {
          case 'create': {
            const nextId = nodes.reduce((max, n) => Math.max(max, n.id), 0) + 1;
            const newNode = {
              id: nextId,
              parent: body.parent ?? null,
              title: body.title || 'Untitled',
              content: body.content || '',
              depth: 0,
              child_count: 0,
              date_created: today,
              date_updated: today
            };
            nodes.push(newNode);
            this.saveNodes(nodes);
            return { help: {}, response: newNode };
          }
          case 'read': {
            const found = nodes.find(n => n.id === body.node);
            if (!found) throw new Error('404 Node Not Found');
            return { help: {}, response: found };
          }
          case 'read_all': {
            let res = [...nodes];
            if (body.search) {
              const q = body.search.toLowerCase();
              res = res.filter(n => n.title.toLowerCase().includes(q) || n.content.toLowerCase().includes(q));
            }
            return { help: {}, response: res };
          }
          case 'children': {
            const parentId = body.node ?? null;
            return { help: {}, response: nodes.filter(n => n.parent === parentId) };
          }
          case 'subtree': {
            const rootId = body.node ?? null;
            const maxDepth = body.depth ?? 10;
            const buildTree = (pId, lvl) => {
              return nodes.filter(n => n.parent === pId).map(child => ({
                ...child,
                children: lvl < maxDepth ? buildTree(child.id, lvl + 1) : [],
                descendant_count: this.getDescendants(nodes, child.id).length,
                max_subtree_depth: this.getMaxDepth(nodes, child.id)
              }));
            };
            return { help: {}, response: buildTree(rootId, 1) };
          }
          case 'update': {
            const node = nodes.find(n => n.id === body.id);
            if (!node) throw new Error('404 Node Not Found');
            if (body.title !== undefined) node.title = body.title;
            if (body.content !== undefined) node.content = body.content;
            node.date_updated = today;
            this.saveNodes(nodes);
            return { help: {}, response: node };
          }
          case 'move': {
            const node = nodes.find(n => n.id === body.id);
            if (!node) throw new Error('404 Node Not Found');
            const targetParent = body.parent ?? null;
            if (targetParent === node.id || this.getDescendants(nodes, node.id).includes(targetParent)) {
              throw new Error('400 Invalid op: Cannot move subtree inside its own descendant.');
            }
            node.parent = targetParent;
            node.date_updated = today;
            this.saveNodes(nodes);
            return { help: {}, response: node };
          }
          case 'copy': {
            const source = nodes.find(n => n.id === body.node);
            if (!source) throw new Error('404 Node Not Found');
            let maxId = nodes.reduce((max, n) => Math.max(max, n.id), 0);
            const clone = (origId, targetP) => {
              const orig = nodes.find(x => x.id === origId);
              maxId++;
              const cloned = {
                ...orig,
                id: maxId,
                parent: targetP,
                title: targetP === (body.parent ?? null) ? `${orig.title} (Copy)` : orig.title,
                date_created: today,
                date_updated: today
              };
              nodes.push(cloned);
              const kids = nodes.filter(k => k.parent === origId && k.id !== cloned.id);
              kids.forEach(k => clone(k.id, cloned.id));
              return cloned;
            };
            const newRoot = clone(source.id, body.parent ?? null);
            this.saveNodes(nodes);
            return { help: {}, response: newRoot };
          }
          case 'delete': {
            const toDelete = [body.node, ...this.getDescendants(nodes, body.node)];
            nodes = nodes.filter(n => !toDelete.includes(n.id));
            this.saveNodes(nodes);
            return { help: {}, response: { id: body.node, deleted: true, deleted_count: toDelete.length } };
          }
        }
      }
    };

    async function apiCall(action, body = {}) {
      const envelope = await MockAPI.request(action, body);
      return envelope.response;
    }

    /* -------------------------------------------------------------
       2. APPLICATION STATE & CLIPBOARD
    ------------------------------------------------------------- */
    const state = {
      activeNodeId: null,
      treeData: [],
      allNodesFlat: [],
      expandedNodes: new Set([1]),
      targetActionNodeId: null,
      clipboard: null, // { op: 'cut' | 'copy', id: number, title: string }
      pendingParentId: null,
      isDirty: false
    };

    async function loadApp() {
      state.treeData = await apiCall('subtree', { node: null, depth: 6 });
      state.allNodesFlat = await apiCall('read_all', {});
      
      // Auto-select first root if none active
      if (!state.activeNodeId && state.treeData.length > 0) {
        state.activeNodeId = state.treeData[0].id;
      }

      renderTree();
      renderBreadcrumbs();
      updateClipboardBar();
      lucide.createIcons();
    }

    /* -------------------------------------------------------------
       3. TREE RENDERING (MOBILE-CENTRIC)
    ------------------------------------------------------------- */
    function renderTree() {
      const container = document.getElementById('treeContainer');
      if (!state.treeData.length) {
        container.innerHTML = `<div class="p-8 text-center text-xs text-slate-400">No notes found. Create a root tree to begin.</div>`;
        return;
      }
      container.innerHTML = state.treeData.map(node => renderNodeBranch(node)).join('');
    }

    function renderNodeBranch(node) {
      const isSelected = node.id === state.activeNodeId;
      const isExpanded = state.expandedNodes.has(node.id);
      const hasChildren = node.children && node.children.length > 0;
      const isCuttingThis = state.clipboard && state.clipboard.op === 'cut' && state.clipboard.id === node.id;

      return `
        <div class="text-xs transition-opacity ${isCuttingThis ? 'opacity-40' : ''}">
          <!-- Row Item -->
          <div class="group flex items-center gap-1.5 p-2 rounded-xl transition ${
            isSelected ? 'bg-indigo-50/80 border border-indigo-200/60 text-brand-900 font-semibold shadow-xs' : 'bg-white border border-slate-200/70 hover:border-slate-300 text-slate-800'
          }">
            <!-- Expand/Collapse Chevron -->
            <button onclick="event.stopPropagation(); toggleExpand(${node.id})" 
                    class="w-7 h-7 flex items-center justify-center rounded-lg text-slate-400 hover:text-slate-800 hover:bg-slate-100 transition shrink-0">
              ${hasChildren 
                ? `<i data-lucide="${isExpanded ? 'chevron-down' : 'chevron-right'}" class="w-4 h-4"></i>` 
                : `<span class="w-1.5 h-1.5 rounded-full bg-slate-300"></span>`
              }
            </button>

            <!-- Node clickable title & info -->
            <div onclick="selectNode(${node.id})" class="flex-1 min-w-0 cursor-pointer flex items-center gap-2 py-0.5">
              <span class="truncate text-sm">${escapeHtml(node.title)}</span>
              ${node.descendant_count > 0 ? `
                <span class="text-[10px] px-1.5 py-0.2 rounded-full bg-slate-100 text-slate-500 font-normal shrink-0 border border-slate-200">
                  ${node.descendant_count}
                </span>
              ` : ''}
            </div>

            <!-- Context Operations Action Button -->
            <button onclick="openActionSheet(${node.id})" 
                    class="w-8 h-8 flex items-center justify-center rounded-lg text-slate-400 hover:text-slate-700 hover:bg-slate-100 shrink-0">
              <i data-lucide="more-vertical" class="w-4 h-4"></i>
            </button>
          </div>

          <!-- Indented Children -->
          ${hasChildren && isExpanded ? `
            <div class="pl-4 ml-3 border-l-2 border-slate-200/60 my-1 space-y-1">
              ${node.children.map(child => renderNodeBranch(child)).join('')}
            </div>
          ` : ''}
        </div>
      `;
    }

    /* -------------------------------------------------------------
       4. EXTENDED BREADCRUMBS (WITH AUTO-SCROLL)
    ------------------------------------------------------------- */
    function renderBreadcrumbs() {
      const container = document.getElementById('breadcrumbsTrack');
      if (!state.activeNodeId) {
        container.innerHTML = `<span class="px-2 py-1 rounded bg-slate-200/50 text-[11px] font-medium">Roots</span>`;
        return;
      }

      const path = [];
      let current = state.allNodesFlat.find(n => n.id === state.activeNodeId);
      while (current) {
        path.unshift(current);
        current = state.allNodesFlat.find(n => n.id === current.parent);
      }

      container.innerHTML = `
        <button onclick="selectNode(null)" class="px-2 py-1 rounded-md text-slate-500 hover:bg-slate-200/60 font-medium shrink-0 flex items-center gap-1">
          <i data-lucide="home" class="w-3.5 h-3.5"></i> <span>Roots</span>
        </button>
        ${path.map((node, index) => {
          const isLast = index === path.length - 1;
          return `
            <i data-lucide="chevron-right" class="w-3.5 h-3.5 text-slate-300 shrink-0"></i>
            <button onclick="selectNode(${node.id})" 
                    title="${escapeHtml(node.title)}"
                    class="px-2 py-1 rounded-md font-medium shrink-0 max-w-[140px] truncate ${
                      isLast ? 'bg-white shadow-xs text-brand-700 font-bold border border-slate-200' : 'text-slate-600 hover:bg-slate-200/60'
                    }">
              ${escapeHtml(node.title)}
            </button>
          `;
        }).join('')}
      `;

      // Auto-scroll breadcrumbs track to the end
      setTimeout(() => {
        container.scrollTo({ left: container.scrollWidth, behavior: 'smooth' });
      }, 50);
    }

    /* -------------------------------------------------------------
       5. NODE SELECTION & ACTIONS
    ------------------------------------------------------------- */
    function selectNode(id) {
      state.activeNodeId = id;
      if (id) state.expandedNodes.add(id);
      renderTree();
      renderBreadcrumbs();
      lucide.createIcons();
    }

    function toggleExpand(id) {
      if (state.expandedNodes.has(id)) {
        state.expandedNodes.delete(id);
      } else {
        state.expandedNodes.add(id);
      }
      renderTree();
      lucide.createIcons();
    }

    function openActionSheet(nodeId) {
      state.targetActionNodeId = nodeId;
      const node = state.allNodesFlat.find(n => n.id === nodeId);
      document.getElementById('actionSheetTitle').innerText = node ? node.title : '';
      document.getElementById('actionSheetSubtitle').innerText = `ID: ${nodeId} • Depth: ${node.depth}`;
      
      // Toggle visibility of Paste option if clipboard has active op
      const pasteBtn = document.getElementById('actionSheetPasteBtn');
      if (state.clipboard && state.clipboard.id !== nodeId) {
        pasteBtn.classList.remove('hidden');
      } else {
        pasteBtn.classList.add('hidden');
      }

      document.getElementById('actionSheet').classList.remove('hidden');
      lucide.createIcons();
    }

    /* -------------------------------------------------------------
       6. SEPARATED OPERATIONS: CUT, COPY, PASTE
    ------------------------------------------------------------- */
    function executeCut(id) {
      const node = state.allNodesFlat.find(n => n.id === id);
      state.clipboard = { op: 'cut', id, title: node.title };
      closeModal('actionSheet');
      updateClipboardBar();
      renderTree();
    }

    function executeCopy(id) {
      const node = state.allNodesFlat.find(n => n.id === id);
      state.clipboard = { op: 'copy', id, title: node.title };
      closeModal('actionSheet');
      updateClipboardBar();
    }

    async function pasteClipboard(targetParentId) {
      if (!state.clipboard) return;
      const { op, id } = state.clipboard;

      try {
        if (op === 'cut') {
          await apiCall('move', { id, parent: targetParentId });
        } else if (op === 'copy') {
          await apiCall('copy', { node: id, parent: targetParentId });
        }
        clearClipboard();
        closeModal('actionSheet');
        if (targetParentId) state.expandedNodes.add(targetParentId);
        loadApp();
      } catch (err) {
        alert(err.message);
      }
    }

    function clearClipboard() {
      state.clipboard = null;
      updateClipboardBar();
      renderTree();
      lucide.createIcons();
    }

    function updateClipboardBar() {
      const bar = document.getElementById('clipboardBar');
      if (!state.clipboard) {
        bar.classList.add('hidden');
        return;
      }
      bar.classList.remove('hidden');
      document.getElementById('clipboardOpText').innerText = state.clipboard.op === 'cut' ? 'Ready to Move (Cut)' : 'Ready to Copy';
      document.getElementById('clipboardTitle').innerText = state.clipboard.title;
      document.getElementById('clipboardIcon').innerHTML = state.clipboard.op === 'cut' 
        ? '<i data-lucide="scissors" class="w-4 h-4"></i>' 
        : '<i data-lucide="copy" class="w-4 h-4"></i>';
      lucide.createIcons();
    }

    async function executeDelete(id) {
      closeModal('actionSheet');
      if (!confirm('Cascade delete this note and ALL nested sub-notes?')) return;
      const res = await apiCall('delete', { node: id });
      if (state.activeNodeId === id) state.activeNodeId = null;
      loadApp();
    }

    /* -------------------------------------------------------------
       7. NODE CREATION (DOES NOT AUTO-NAVIGATE)
    ------------------------------------------------------------- */
    function openCreateModal(parentId = null) {
      state.pendingParentId = parentId;
      document.getElementById('createModalTitle').innerText = parentId ? 'Add Sub-note' : 'Add Root Note';
      document.getElementById('newNoteTitle').value = '';
      document.getElementById('newNoteContent').value = '';
      closeModal('actionSheet');
      document.getElementById('createModal').classList.remove('hidden');
    }

    async function submitCreateNode() {
      const title = document.getElementById('newNoteTitle').value.trim();
      const content = document.getElementById('newNoteContent').value;
      if (!title) return alert('Please enter a note title.');

      await apiCall('create', { parent: state.pendingParentId, title, content });
      closeModal('createModal');

      // Expand parent so newly created child is visible, but KEEP activeNode intact!
      if (state.pendingParentId) {
        state.expandedNodes.add(state.pendingParentId);
      }
      loadApp();
    }

    /* -------------------------------------------------------------
       8. EDITOR SLIDE-OVER
    ------------------------------------------------------------- */
    async function openEditorSheet(id) {
      closeModal('actionSheet');
      const node = await apiCall('read', { node: id });
      state.targetActionNodeId = id;
      document.getElementById('editTitle').value = node.title;
      document.getElementById('editContent').value = node.content;
      document.getElementById('editorSaveBtn').disabled = true;
      document.getElementById('editorSaveStatus').innerText = `Updated ${node.date_updated}`;

      document.getElementById('editorPills').innerHTML = `
        <span class="px-2 py-0.5 rounded bg-slate-100 font-mono text-[10px]">ID: ${node.id}</span>
        <span class="px-2 py-0.5 rounded bg-indigo-50 text-indigo-700 font-medium">Depth ${node.depth}</span>
        <span class="px-2 py-0.5 rounded bg-slate-100">${node.child_count} Direct Children</span>
      `;

      document.getElementById('editorSheet').classList.remove('hidden');
      lucide.createIcons();
    }

    function markDirty() {
      document.getElementById('editorSaveBtn').disabled = false;
      document.getElementById('editorSaveStatus').innerText = 'Unsaved changes...';
    }

    async function saveActiveNote() {
      const title = document.getElementById('editTitle').value.trim();
      const content = document.getElementById('editContent').value;
      if (!title) return alert('Title cannot be empty');

      await apiCall('update', { id: state.targetActionNodeId, title, content });
      document.getElementById('editorSaveBtn').disabled = true;
      document.getElementById('editorSaveStatus').innerText = 'Saved!';
      loadApp();
    }

    /* -------------------------------------------------------------
       9. SEARCH (read_all)
    ------------------------------------------------------------- */
    function openSearchModal() {
      document.getElementById('searchModal').classList.remove('hidden');
      document.getElementById('modalSearchInput').focus();
    }

    async function handleSearch(query) {
      const q = query.trim();
      const container = document.getElementById('searchResults');
      if (!q) {
        container.innerHTML = '<p class="text-slate-400 text-center py-4">Type to search notes...</p>';
        return;
      }
      const results = await apiCall('read_all', { search: q });
      if (!results.length) {
        container.innerHTML = '<p class="text-slate-400 text-center py-4">No results found.</p>';
        return;
      }
      container.innerHTML = results.map(n => `
        <div onclick="selectNode(${n.id}); closeModal('searchModal')" class="p-2 rounded-lg hover:bg-slate-100 cursor-pointer flex justify-between items-center border border-slate-100">
          <div class="truncate">
            <p class="font-semibold text-slate-800">${escapeHtml(n.title)}</p>
            <p class="text-[10px] text-slate-400 truncate">${escapeHtml(n.content || 'No content')}</p>
          </div>
          <span class="text-[10px] text-slate-400 bg-slate-100 px-1.5 py-0.5 rounded ml-2 shrink-0">d:${n.depth}</span>
        </div>
      `).join('');
    }

    /* -------------------------------------------------------------
       10. UTILITIES
    ------------------------------------------------------------- */
    function closeModal(id) {
      document.getElementById(id).classList.add('hidden');
    }

    function escapeHtml(str) {
      if (!str) return '';
      return str.replace(/[&<>"']/g, m => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[m]));
    }

    window.addEventListener('DOMContentLoaded', loadApp);
  </script>
</body>
</html>

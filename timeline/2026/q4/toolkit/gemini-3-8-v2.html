<!DOCTYPE html>
<html lang="en" data-theme="dusk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Curated Tools Hub</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;1,600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS & Lucide Icons CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    /* 1. OBSIDIAN NEON (Dark) */
    [data-theme="obsidian"] {
      --font-heading: 'Plus Jakarta Sans', sans-serif;
      --bg-main: #060913;
      --bg-surface: rgba(15, 23, 42, 0.75);
      --bg-card: rgba(17, 24, 39, 0.65);
      --bg-card-hover: rgba(30, 41, 59, 0.9);
      --border: rgba(99, 102, 241, 0.15);
      --border-hover: rgba(99, 102, 241, 0.45);
      --text-title: #f8fafc;
      --text-body: #94a3b8;
      --text-muted: #64748b;
      --accent: #6366f1;
      --accent-hover: #4f46e5;
      --accent-contrast: #ffffff;
      --glow-1: rgba(99, 102, 241, 0.18);
      --glow-2: rgba(168, 85, 247, 0.14);
      --badge-bg: rgba(99, 102, 241, 0.12);
      --badge-border: rgba(99, 102, 241, 0.25);
      --badge-text: #c7d2fe;
    }

    /* 2. NORDIC PINE (Dark) */
    [data-theme="pine"] {
      --font-heading: 'Plus Jakarta Sans', sans-serif;
      --bg-main: #051310;
      --bg-surface: rgba(9, 29, 25, 0.78);
      --bg-card: rgba(12, 36, 31, 0.65);
      --bg-card-hover: rgba(19, 54, 47, 0.9);
      --border: rgba(52, 211, 153, 0.18);
      --border-hover: rgba(52, 211, 153, 0.45);
      --text-title: #f0fdf4;
      --text-body: #9ca3af;
      --text-muted: #4ade80;
      --accent: #10b981;
      --accent-hover: #059669;
      --accent-contrast: #ffffff;
      --glow-1: rgba(16, 185, 129, 0.16);
      --glow-2: rgba(245, 158, 11, 0.10);
      --badge-bg: rgba(16, 185, 129, 0.12);
      --badge-border: rgba(16, 185, 129, 0.25);
      --badge-text: #a7f3d0;
    }

    /* 3. TOKYO DUSK (Dark Sunset) */
    [data-theme="dusk"] {
      --font-heading: 'Plus Jakarta Sans', sans-serif;
      --bg-main: #0c0714;
      --bg-surface: rgba(21, 12, 34, 0.8);
      --bg-card: rgba(28, 16, 46, 0.65);
      --bg-card-hover: rgba(45, 23, 73, 0.9);
      --border: rgba(244, 63, 94, 0.2);
      --border-hover: rgba(251, 146, 60, 0.55);
      --text-title: #fff1f2;
      --text-body: #cbd5e1;
      --text-muted: #fda4af;
      --accent: #f43f5e;
      --accent-hover: #e11d48;
      --accent-contrast: #ffffff;
      --glow-1: rgba(244, 63, 94, 0.22);
      --glow-2: rgba(249, 115, 22, 0.18);
      --badge-bg: rgba(244, 63, 94, 0.14);
      --badge-border: rgba(244, 63, 94, 0.3);
      --badge-text: #fecdd3;
    }

    /* 4. EDITORIAL PAPER (Light) */
    [data-theme="paper"] {
      --font-heading: 'Playfair Display', serif;
      --bg-main: #f9f6f0;
      --bg-surface: rgba(243, 238, 228, 0.88);
      --bg-card: #ffffff;
      --bg-card-hover: #ffffff;
      --border: #e6ded2;
      --border-hover: #c2612a;
      --text-title: #231f20;
      --text-body: #57534e;
      --text-muted: #8c827a;
      --accent: #b45309;
      --accent-hover: #92400e;
      --accent-contrast: #ffffff;
      --glow-1: rgba(180, 83, 9, 0.08);
      --glow-2: rgba(194, 97, 42, 0.08);
      --badge-bg: rgba(180, 83, 9, 0.08);
      --badge-border: rgba(180, 83, 9, 0.2);
      --badge-text: #92400e;
    }

    /* 5. GLACIER FROST (Light) */
    [data-theme="frost"] {
      --font-heading: 'Plus Jakarta Sans', sans-serif;
      --bg-main: #f1f5f9;
      --bg-surface: rgba(255, 255, 255, 0.82);
      --bg-card: rgba(255, 255, 255, 0.7);
      --bg-card-hover: #ffffff;
      --border: #e2e8f0;
      --border-hover: #3b82f6;
      --text-title: #0f172a;
      --text-body: #475569;
      --text-muted: #94a3b8;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --accent-contrast: #ffffff;
      --glow-1: rgba(37, 99, 235, 0.12);
      --glow-2: rgba(147, 197, 253, 0.25);
      --badge-bg: rgba(37, 99, 235, 0.08);
      --badge-border: rgba(37, 99, 235, 0.2);
      --badge-text: #2563eb;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-title);
      font-family: 'Plus Jakarta Sans', sans-serif;
      transition: background-color 0.4s ease, color 0.4s ease;
    }

    .brand-heading {
      font-family: var(--font-heading);
    }
  </style>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            app: {
              main: 'var(--bg-main)',
              surface: 'var(--bg-surface)',
              card: 'var(--bg-card)',
              cardHover: 'var(--bg-card-hover)',
              border: 'var(--border)',
              borderHover: 'var(--border-hover)',
              title: 'var(--text-title)',
              body: 'var(--text-body)',
              muted: 'var(--text-muted)',
              accent: 'var(--accent)',
              accentHover: 'var(--accent-hover)',
              contrast: 'var(--accent-contrast)',
              badgeBg: 'var(--badge-bg)',
              badgeBorder: 'var(--badge-border)',
              badgeText: 'var(--badge-text)',
            }
          }
        }
      }
    }
  </script>
</head>
<body class="min-h-screen antialiased flex flex-col selection:bg-app-accent selection:text-white">

  <!-- Ambient Backdrop Glows -->
  <div class="fixed inset-0 pointer-events-none overflow-hidden -z-10 transition-all duration-700">
    <div class="absolute -top-32 -left-32 w-[34rem] h-[34rem] rounded-full blur-3xl transition-all duration-700" style="background-color: var(--glow-1)"></div>
    <div class="absolute top-1/2 -right-32 w-[32rem] h-[32rem] rounded-full blur-3xl transition-all duration-700" style="background-color: var(--glow-2)"></div>
  </div>

  <!-- Header -->
  <header class="border-b border-app-border sticky top-0 z-30 backdrop-blur-xl bg-app-surface transition-colors duration-300">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4">
      <div class="flex flex-col md:flex-row items-center justify-between gap-4">
        
        <!-- Logo -->
        <div class="flex items-center justify-between w-full md:w-auto">
          <div class="flex items-center gap-3.5">
            <div class="h-10 w-10 rounded-2xl bg-app-accent text-app-contrast flex items-center justify-center shadow-lg shadow-app-accent/25 transition-all duration-300">
              <i data-lucide="sparkles" class="w-5 h-5"></i>
            </div>
            <div>
              <h1 class="text-xl font-bold tracking-tight text-app-title brand-heading flex items-center gap-2">
                Tool Directory
                <span class="text-[10px] font-semibold tracking-wider uppercase px-2 py-0.5 rounded-full bg-app-badgeBg text-app-badgeText border border-app-badgeBorder">Pro</span>
              </h1>
              <p class="text-xs text-app-body">Curated personal workspace apps</p>
            </div>
          </div>
        </div>

        <!-- Controls: Search, Theme Selector, Add Tool -->
        <div class="flex flex-wrap sm:flex-nowrap items-center gap-2.5 w-full md:w-auto justify-end">
          
          <!-- Search -->
          <div class="relative flex-1 sm:w-64">
            <i data-lucide="search" class="w-4 h-4 text-app-muted absolute left-3.5 top-1/2 -translate-y-1/2 pointer-events-none"></i>
            <input 
              type="text" 
              id="searchInput" 
              placeholder="Search tools or tags..." 
              class="w-full pl-9 pr-3.5 py-2 bg-app-card border border-app-border rounded-xl text-sm text-app-title placeholder:text-app-muted focus:outline-none focus:border-app-accent transition-all"
            >
          </div>

          <!-- Theme Selector -->
          <div class="relative">
            <button 
              id="themeToggleBtn" 
              class="flex items-center gap-2 px-3 py-2 bg-app-card hover:bg-app-cardHover border border-app-border rounded-xl text-sm font-medium text-app-title transition shadow-sm"
            >
              <i data-lucide="palette" class="w-4 h-4 text-app-accent"></i>
              <span id="currentThemeName" class="text-xs font-semibold">Theme</span>
              <i data-lucide="chevron-down" class="w-3.5 h-3.5 text-app-muted"></i>
            </button>

            <div id="themeMenu" class="hidden absolute right-0 mt-2 w-56 p-1.5 bg-app-surface border border-app-border rounded-2xl shadow-2xl backdrop-blur-2xl z-50">
              <div class="px-3 py-1.5 text-[10px] font-bold uppercase tracking-wider text-app-muted">Dark Themes</div>
              
              <button onclick="setTheme('dusk')" class="w-full flex items-center justify-between px-3 py-2 rounded-xl text-xs font-medium text-app-title hover:bg-app-card transition text-left">
                <div class="flex items-center gap-2.5">
                  <span class="w-3 h-3 rounded-full bg-rose-500 ring-2 ring-slate-900"></span>
                  <span>Tokyo Dusk</span>
                </div>
                <span class="text-[10px] text-app-muted">Sunset</span>
              </button>

              <button onclick="setTheme('obsidian')" class="w-full flex items-center justify-between px-3 py-2 rounded-xl text-xs font-medium text-app-title hover:bg-app-card transition text-left">
                <div class="flex items-center gap-2.5">
                  <span class="w-3 h-3 rounded-full bg-indigo-500 ring-2 ring-slate-900"></span>
                  <span>Obsidian Neon</span>
                </div>
                <span class="text-[10px] text-app-muted">Dark</span>
              </button>

              <button onclick="setTheme('pine')" class="w-full flex items-center justify-between px-3 py-2 rounded-xl text-xs font-medium text-app-title hover:bg-app-card transition text-left">
                <div class="flex items-center gap-2.5">
                  <span class="w-3 h-3 rounded-full bg-emerald-500 ring-2 ring-slate-900"></span>
                  <span>Nordic Pine</span>
                </div>
                <span class="text-[10px] text-app-muted">Forest</span>
              </button>

              <div class="my-1 border-t border-app-border"></div>
              <div class="px-3 py-1.5 text-[10px] font-bold uppercase tracking-wider text-app-muted">Light Themes</div>

              <button onclick="setTheme('paper')" class="w-full flex items-center justify-between px-3 py-2 rounded-xl text-xs font-medium text-app-title hover:bg-app-card transition text-left">
                <div class="flex items-center gap-2.5">
                  <span class="w-3 h-3 rounded-full bg-amber-700 ring-2 ring-stone-200"></span>
                  <span>Editorial Paper</span>
                </div>
                <span class="text-[10px] text-app-muted">Warm</span>
              </button>

              <button onclick="setTheme('frost')" class="w-full flex items-center justify-between px-3 py-2 rounded-xl text-xs font-medium text-app-title hover:bg-app-card transition text-left">
                <div class="flex items-center gap-2.5">
                  <span class="w-3 h-3 rounded-full bg-blue-500 ring-2 ring-slate-200"></span>
                  <span>Glacier Frost</span>
                </div>
                <span class="text-[10px] text-app-muted">Clean</span>
              </button>
            </div>
          </div>

          <!-- Add Button -->
          <button 
            id="openModalBtn"
            class="flex items-center gap-1.5 bg-app-accent hover:bg-app-accentHover text-app-contrast text-sm font-semibold px-3.5 py-2 rounded-xl transition shadow-lg shadow-app-accent/20 active:scale-95 whitespace-nowrap"
          >
            <i data-lucide="plus" class="w-4 h-4"></i>
            <span>Add Tool</span>
          </button>
        </div>
      </div>

      <!-- Categories & Filters -->
      <div class="flex items-center gap-2 mt-4 pt-2 overflow-x-auto pb-1 text-sm no-scrollbar">
        <!-- Favorites Filter Button -->
        <button data-filter="favorites" class="filter-btn px-3.5 py-1.5 rounded-xl font-medium border border-app-border bg-app-card text-app-body text-xs sm:text-sm transition flex items-center gap-1.5">
          <i data-lucide="star" class="w-3.5 h-3.5 text-amber-400 fill-amber-400"></i>
          <span>Favorites</span>
          <span id="favCount" class="text-xs px-1.5 py-0.5 rounded-full bg-app-border/40 font-mono">0</span>
        </button>

        <!-- All Apps Filter Button -->
        <button data-filter="all" class="filter-btn px-3.5 py-1.5 rounded-xl font-medium border border-app-border bg-app-card text-app-body text-xs sm:text-sm transition flex items-center gap-1.5">
          <span>All Apps</span>
          <span id="allCount" class="text-xs px-1.5 py-0.5 rounded-full bg-app-border/40 font-mono">0</span>
        </button>

        <div class="h-4 w-[1px] bg-app-border mx-1"></div>
        <button data-filter="Development" class="filter-btn px-3.5 py-1.5 rounded-xl font-medium border border-app-border bg-app-card text-app-body hover:text-app-title text-xs sm:text-sm transition">Development</button>
        <button data-filter="Design" class="filter-btn px-3.5 py-1.5 rounded-xl font-medium border border-app-border bg-app-card text-app-body hover:text-app-title text-xs sm:text-sm transition">Design</button>
        <button data-filter="Productivity" class="filter-btn px-3.5 py-1.5 rounded-xl font-medium border border-app-border bg-app-card text-app-body hover:text-app-title text-xs sm:text-sm transition">Productivity</button>
        <button data-filter="AI" class="filter-btn px-3.5 py-1.5 rounded-xl font-medium border border-app-border bg-app-card text-app-body hover:text-app-title text-xs sm:text-sm transition">AI</button>
      </div>
    </div>
  </header>

  <!-- App Cards Grid -->
  <main class="flex-1 max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 w-full">
    <div id="appsGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-5"></div>

    <!-- Empty State -->
    <div id="emptyState" class="hidden flex-col items-center justify-center text-center py-20">
      <div class="h-16 w-16 rounded-2xl bg-app-card border border-app-border flex items-center justify-center text-app-muted mb-4 shadow-sm">
        <i data-lucide="inbox" class="w-8 h-8"></i>
      </div>
      <h3 class="text-lg font-bold text-app-title brand-heading">No tools found</h3>
      <p class="text-sm text-app-body mt-1 max-w-sm">No applications matched your criteria. Try adjusting your search query or switching tabs.</p>
    </div>
  </main>

  <!-- Add New App Modal -->
  <div id="addModal" class="fixed inset-0 z-50 flex items-center justify-center bg-black/60 backdrop-blur-md opacity-0 pointer-events-none transition-all duration-300">
    <div class="bg-app-surface border border-app-border rounded-3xl w-full max-w-md p-6 shadow-2xl scale-95 transition-all duration-300 m-4" id="modalCard">
      <div class="flex items-center justify-between pb-4 border-b border-app-border">
        <div>
          <h3 class="font-bold text-lg text-app-title brand-heading">Add Tool</h3>
          <p class="text-xs text-app-body">Add any URL into your directory</p>
        </div>
        <button id="closeModalBtn" class="text-app-muted hover:text-app-title p-1.5 rounded-xl">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>
      
      <form id="addAppForm" class="space-y-4 mt-4">
        <div>
          <label class="block text-xs font-semibold text-app-title uppercase tracking-wider mb-1">Title</label>
          <input type="text" id="appTitle" required placeholder="e.g. Supabase" class="w-full px-3.5 py-2.5 bg-app-card border border-app-border rounded-xl text-sm text-app-title focus:outline-none focus:border-app-accent transition">
        </div>
        <div>
          <label class="block text-xs font-semibold text-app-title uppercase tracking-wider mb-1">App URL</label>
          <input type="url" id="appUrl" required placeholder="https://supabase.com" class="w-full px-3.5 py-2.5 bg-app-card border border-app-border rounded-xl text-sm text-app-title focus:outline-none focus:border-app-accent transition">
        </div>
        <div>
          <label class="block text-xs font-semibold text-app-title uppercase tracking-wider mb-1">Category</label>
          <select id="appCategory" class="w-full px-3.5 py-2.5 bg-app-card border border-app-border rounded-xl text-sm text-app-title focus:outline-none focus:border-app-accent transition">
            <option value="Development">Development</option>
            <option value="Design">Design</option>
            <option value="Productivity">Productivity</option>
            <option value="AI">AI</option>
            <option value="Other">Other</option>
          </select>
        </div>
        <div>
          <label class="block text-xs font-semibold text-app-title uppercase tracking-wider mb-1">Description</label>
          <textarea id="appDesc" rows="3" required placeholder="Short summary of what this tool is used for..." class="w-full px-3.5 py-2 bg-app-card border border-app-border rounded-xl text-sm text-app-title focus:outline-none focus:border-app-accent transition"></textarea>
        </div>
        
        <div class="flex items-center justify-end gap-3 pt-4 border-t border-app-border">
          <button type="button" id="cancelModalBtn" class="px-4 py-2 rounded-xl text-sm font-medium text-app-body hover:bg-app-card transition">Cancel</button>
          <button type="submit" class="px-4 py-2 rounded-xl text-sm font-semibold bg-app-accent hover:bg-app-accentHover text-app-contrast transition shadow-lg shadow-app-accent/20">Add Tool</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    // Initial Apps
    const defaultApps = [
      {
        id: "app-1",
        title: "GitHub",
        url: "https://github.com",
        description: "Source code repository, developer workflows, code reviews, and CI/CD pipelines.",
        category: "Development"
      },
      {
        id: "app-2",
        title: "Figma",
        url: "https://figma.com",
        description: "Collaborative design platform for web apps, modern interfaces, and vector prototyping.",
        category: "Design"
      },
      {
        id: "app-3",
        title: "Claude",
        url: "https://claude.ai",
        description: "Anthropic's next-generation conversational AI for nuanced reasoning, writing, and code.",
        category: "AI"
      },
      {
        id: "app-4",
        title: "Notion",
        url: "https://notion.so",
        description: "Adaptive team wiki, sprint roadmaps, connected knowledge base, and live documentation.",
        category: "Productivity"
      },
      {
        id: "app-5",
        title: "Vercel",
        url: "https://vercel.com",
        description: "Global frontend hosting and serverless infrastructure with instant preview environments.",
        category: "Development"
      },
      {
        id: "app-6",
        title: "Linear",
        url: "https://linear.app",
        description: "Crafted for high-velocity software teams. Track sprints, issues, and milestone roadmaps.",
        category: "Productivity"
      },
      {
        id: "app-7",
        title: "Midjourney",
        url: "https://midjourney.com",
        description: "State-of-the-art AI imagery generation exploring human imagination and visual arts.",
        category: "AI"
      },
      {
        id: "app-8",
        title: "Raycast",
        url: "https://raycast.com",
        description: "Ultra-fast keystroke productivity launcher that replaces your standard desktop search.",
        category: "Productivity"
      }
    ];

    // State Variables - Persistent LocalStorage
    let apps = JSON.parse(localStorage.getItem("custom_apps_list")) || defaultApps;
    let favorites = new Set(JSON.parse(localStorage.getItem("app_favorites")) || ["app-1", "app-3"]);
    
    // DEFAULTS TO "favorites" and PERSISTS ANY TAB YOU PICK
    let currentFilter = localStorage.getItem("app_active_filter") || "favorites";
    let searchQuery = "";
    let activeTheme = localStorage.getItem("app_theme") || "dusk";

    // Theme metadata
    const themeNames = {
      dusk: "Tokyo Dusk",
      obsidian: "Obsidian",
      pine: "Nordic Pine",
      paper: "Editorial Paper",
      frost: "Glacier Frost"
    };

    // DOM Elements
    const appsGrid = document.getElementById("appsGrid");
    const emptyState = document.getElementById("emptyState");
    const searchInput = document.getElementById("searchInput");
    const filterButtons = document.querySelectorAll(".filter-btn");
    const allCountEl = document.getElementById("allCount");
    const favCountEl = document.getElementById("favCount");
    const themeToggleBtn = document.getElementById("themeToggleBtn");
    const themeMenu = document.getElementById("themeMenu");
    const currentThemeNameEl = document.getElementById("currentThemeName");

    // Modal Elements
    const addModal = document.getElementById("addModal");
    const modalCard = document.getElementById("modalCard");
    const openModalBtn = document.getElementById("openModalBtn");
    const closeModalBtn = document.getElementById("closeModalBtn");
    const cancelModalBtn = document.getElementById("cancelModalBtn");
    const addAppForm = document.getElementById("addAppForm");

    function getDomain(url) {
      try {
        return new URL(url).hostname;
      } catch (e) {
        return 'google.com';
      }
    }

    // Set & Persist Theme
    window.setTheme = function(themeName) {
      activeTheme = themeName;
      document.documentElement.setAttribute("data-theme", themeName);
      localStorage.setItem("app_theme", themeName);
      currentThemeNameEl.textContent = themeNames[themeName] || "Theme";
      themeMenu.classList.add("hidden");
    };

    // Set & Persist Filter Tabs UI
    function updateFilterUI(filterValue) {
      filterButtons.forEach(btn => {
        const isMatch = btn.getAttribute("data-filter") === filterValue;
        const countBadge = btn.querySelector("span:last-child");

        if (isMatch) {
          btn.classList.add("active", "bg-app-accent", "text-app-contrast", "border-app-accent", "font-semibold", "shadow-sm");
          btn.classList.remove("bg-app-card", "text-app-body", "border-app-border", "font-medium");
          if (countBadge) {
            countBadge.className = "text-xs px-1.5 py-0.5 rounded-full bg-black/15 font-mono";
          }
        } else {
          btn.classList.remove("active", "bg-app-accent", "text-app-contrast", "border-app-accent", "font-semibold", "shadow-sm");
          btn.classList.add("bg-app-card", "text-app-body", "border-app-border", "font-medium");
          if (countBadge) {
            countBadge.className = "text-xs px-1.5 py-0.5 rounded-full bg-app-border/40 font-mono";
          }
        }
      });
    }

    // Filter Button Click Handler
    filterButtons.forEach(btn => {
      btn.addEventListener("click", () => {
        currentFilter = btn.getAttribute("data-filter");
        // Persist the choice
        localStorage.setItem("app_active_filter", currentFilter);
        updateFilterUI(currentFilter);
        renderApps();
      });
    });

    // Theme Dropdown Toggle
    themeToggleBtn.addEventListener("click", (e) => {
      e.stopPropagation();
      themeMenu.classList.toggle("hidden");
    });
    document.addEventListener("click", () => themeMenu.classList.add("hidden"));

    // Render Grid
    function renderApps() {
      const filtered = apps.filter(app => {
        const matchesSearch = 
          app.title.toLowerCase().includes(searchQuery.toLowerCase()) || 
          app.description.toLowerCase().includes(searchQuery.toLowerCase()) ||
          app.category.toLowerCase().includes(searchQuery.toLowerCase());
        
        let matchesFilter = true;
        if (currentFilter === "favorites") {
          matchesFilter = favorites.has(app.id);
        } else if (currentFilter !== "all") {
          matchesFilter = app.category.toLowerCase() === currentFilter.toLowerCase();
        }

        return matchesSearch && matchesFilter;
      });

      allCountEl.textContent = apps.length;
      favCountEl.textContent = favorites.size;

      if (filtered.length === 0) {
        appsGrid.innerHTML = "";
        emptyState.classList.remove("hidden");
        emptyState.classList.add("flex");
        return;
      } else {
        emptyState.classList.add("hidden");
        emptyState.classList.remove("flex");
      }

      appsGrid.innerHTML = filtered.map(app => {
        const isFav = favorites.has(app.id);
        const domain = getDomain(app.url);
        const iconUrl = `https://www.google.com/s2/favicons?domain=${domain}&sz=128`;

        return `
          <div class="group relative bg-app-card hover:bg-app-cardHover border border-app-border hover:border-app-borderHover rounded-2xl p-5 flex flex-col justify-between transition-all duration-300 hover:shadow-xl hover:-translate-y-1">
            <div>
              <div class="flex items-start justify-between gap-3 mb-3.5">
                <div class="h-11 w-11 rounded-xl bg-app-main border border-app-border flex items-center justify-center p-2 group-hover:scale-105 transition-transform overflow-hidden shadow-inner">
                  <img src="${iconUrl}" alt="${app.title}" class="h-full w-full object-contain rounded-md" onerror="this.src='https://avatar.vercel.sh/${app.title}.svg'" />
                </div>
                
                <div class="flex items-center gap-1.5">
                  <span class="text-[11px] font-semibold px-2.5 py-0.5 rounded-full bg-app-badgeBg text-app-badgeText border border-app-badgeBorder">
                    ${app.category}
                  </span>
                  <button 
                    onclick="toggleFavorite('${app.id}', event)" 
                    title="${isFav ? 'Remove from favorites' : 'Add to favorites'}"
                    class="p-1.5 rounded-xl border transition-all ${
                      isFav 
                        ? 'bg-amber-500/15 border-amber-500/40 text-amber-400' 
                        : 'border-app-border bg-app-main/50 text-app-muted hover:text-app-title'
                    }"
                  >
                    <i data-lucide="star" class="w-4 h-4 ${isFav ? 'fill-amber-400' : ''}"></i>
                  </button>
                </div>
              </div>

              <h3 class="font-bold text-app-title text-base group-hover:text-app-accent transition-colors brand-heading">
                ${app.title}
              </h3>

              <p class="text-xs text-app-body line-clamp-2 leading-relaxed mt-1.5">
                ${app.description}
              </p>
            </div>

            <div class="mt-5 pt-3.5 border-t border-app-border flex items-center justify-between">
              <span class="text-[11px] text-app-muted font-mono truncate max-w-[150px]">${domain}</span>
              <a 
                href="${app.url}" 
                target="_blank" 
                rel="noopener noreferrer" 
                class="inline-flex items-center gap-1.5 text-xs font-semibold text-app-title bg-app-surface hover:bg-app-accent hover:text-app-contrast border border-app-border hover:border-app-accent px-3 py-1.5 rounded-xl transition-all shadow-sm"
              >
                <span>Launch</span>
                <i data-lucide="external-link" class="w-3.5 h-3.5"></i>
              </a>
            </div>
          </div>
        `;
      }).join('');

      lucide.createIcons();
    }

    // Toggle Favorite
    window.toggleFavorite = function(id, event) {
      event.preventDefault();
      event.stopPropagation();
      
      if (favorites.has(id)) {
        favorites.delete(id);
      } else {
        favorites.add(id);
      }

      localStorage.setItem("app_favorites", JSON.stringify(Array.from(favorites)));
      renderApps();
    };

    // Instant Search
    searchInput.addEventListener("input", (e) => {
      searchQuery = e.target.value.trim();
      renderApps();
    });

    // Modal Handling
    function openModal() {
      addModal.classList.remove("opacity-0", "pointer-events-none");
      modalCard.classList.remove("scale-95");
      modalCard.classList.add("scale-100");
    }

    function closeModal() {
      modalCard.classList.remove("scale-100");
      modalCard.classList.add("scale-95");
      addModal.classList.add("opacity-0", "pointer-events-none");
      addAppForm.reset();
    }

    openModalBtn.addEventListener("click", openModal);
    closeModalBtn.addEventListener("click", closeModal);
    cancelModalBtn.addEventListener("click", closeModal);
    addModal.addEventListener("click", (e) => {
      if (e.target === addModal) closeModal();
    });

    // Add New Tool
    addAppForm.addEventListener("submit", (e) => {
      e.preventDefault();

      let url = document.getElementById("appUrl").value.trim();
      if (!url.startsWith("http://") && !url.startsWith("https://")) {
        url = "https://" + url;
      }

      const newApp = {
        id: "app-" + Date.now(),
        title: document.getElementById("appTitle").value.trim(),
        url: url,
        category: document.getElementById("appCategory").value,
        description: document.getElementById("appDesc").value.trim()
      };

      apps.unshift(newApp);
      localStorage.setItem("custom_apps_list", JSON.stringify(apps));
      
      closeModal();
      renderApps();
    });

    // Initial setup on page load
    setTheme(activeTheme);
    updateFilterUI(currentFilter);
    renderApps();
  </script>
</body>
</html>
